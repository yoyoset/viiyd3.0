baseURL = 'https://viiyd.com/'
title = 'VIIYD Studio'   # 根标题只作兜底，实际用 [languages.*] 里的分语言标题
theme = []

# 模板 layouts/robots.txt 一直存在，但没开这个开关 Hugo 不渲染它。
# **必须放在第一个 [表头] 之前** —— TOML 里表头之后的裸键属于那个表，
# 放在 [languages.zh] 后面会变成语言的子键，静默失效。
enableRobotsTXT = true

# 这两条原本写在 [params] 之后 —— 于是变成了 params 的子键（实测
# `hugo config` 里能看到 params.defaultcontentlanguage），**根本没作为配置生效**。
# 站点表现正确纯属巧合：Hugo 的默认值恰好就是 en / false。
# 哪天想改成中文优先，改那两行会毫无反应。
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[params]
  turnstileSiteKey = "0x4AAAAAACNE6SxZEmTQJClP"
  # Site-wide fallback social share image (pages with a cover override it)
  ogImage = "https://photo.viiyd.com/2026/05/silent-king/viiyd20260523silent-king_01_web.webp"
  # Cloudflare Web Analytics beacon token — grab from dash.cloudflare.com → Analytics → Web Analytics
  cfBeaconToken = "8217e1c246824a018a743776dbb7aa71"

# Multilingual Config

[languages]
  [languages.en]
    languageName = 'English'
    contentDir = 'content'
    weight = 1
    title = 'VIIYD · Miniature Painting Studio'
    [languages.en.params]
      description = "Commission-grade Warhammer & tabletop miniature painting studio in Chengdu. Display-level NMM, OSL and freehand work, documented piece by piece — two display slots open each quarter."
    [[languages.en.menu.main]]
      name = "Home"
      pageRef = "/"
      weight = 10
    [[languages.en.menu.main]]
      name = "Work"
      pageRef = "work"
      weight = 20
    [[languages.en.menu.main]]
      name = "Services"
      pageRef = "services"
      weight = 40
    [[languages.en.menu.main]]
      name = "About"
      pageRef = "about"
      weight = 50

  [languages.zh]
    languageName = '中文'
    weight = 2
    title = 'VIIYD · 战锤模型涂装工作室'
    [languages.zh.params]
      description = "成都战锤微缩模型涂装委托工作室。展示级 NMM 金属光、OSL 光源效果与手绘自由涂，每件作品独立档案记录——每季度仅开放两个展示位。"
    [[languages.zh.menu.main]]
      name = "首页"
      pageRef = "/"
      weight = 10
    [[languages.zh.menu.main]]
      name = "作品"
      pageRef = "work"
      weight = 20
    [[languages.zh.menu.main]]
      name = "服务与计价"
      pageRef = "services"
      weight = 40
    [[languages.zh.menu.main]]
      name = "关于"
      pageRef = "about"
      weight = 50

# 4.0 分类体系：停用 Hugo 默认的 tags/categories（生成了 259 个垃圾页，
# 且用旧模板泄漏了遗留正文），换成筛选真正用的两个维度。
# 这些静态页兼作 SEO 落地页与小红书/IG 投放落点（营销规划 §5-1）。
[taxonomies]
  # 单复同形 —— Hugo 用复数名去 front matter 取值，而内容里的键是 system，
  # 若写成 systems 就取不到值，分类页会全空（实测栽过）。
  #
  # 2026-09-03：tier 分类已移除。每一单都是定制，档位概念本身不成立，
  # front matter 里的 tier 字段保留但不再产出 /tier/* 落地页。
  system = "system"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.110.0"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[build]
  writeStats = true
  
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"
