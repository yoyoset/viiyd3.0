baseURL = 'https://viiyd.com/'
title = 'VIIYD 3.0'
theme = []

[params]
  turnstileSiteKey = "0x4AAAAAACNE6SxZEmTQJClP"
  # Site-wide fallback social share image (pages with a cover override it)
  ogImage = "https://photo.viiyd.com/2026/05/silent-king/viiyd20260523silent-king_01_web.webp"
  # Cloudflare Web Analytics beacon token — grab from dash.cloudflare.com → Analytics → Web Analytics
  cfBeaconToken = ""

# Multilingual Config
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    languageName = 'English'
    contentDir = 'content'
    weight = 1
    title = 'VIIYD · Miniature Painting Studio'
    [languages.en.params]
      description = "Commission-grade Warhammer & tabletop miniature painting studio in Chengdu. Display-level NMM, OSL and freehand work, documented piece by piece — two display slots open each quarter."
    [[languages.en.menu.main]]
      name = "Home"
      pageRef = "/"
      weight = 10
    [[languages.en.menu.main]]
      name = "Work"
      pageRef = "work"
      weight = 20
    [[languages.en.menu.main]]
      name = "Process"
      pageRef = "process"
      weight = 30
    [[languages.en.menu.main]]
      name = "Services"
      pageRef = "rates"
      weight = 40
    [[languages.en.menu.main]]
      name = "About"
      pageRef = "about"
      weight = 50

  [languages.zh]
    languageName = '中文'
    weight = 2
    title = 'VIIYD · 战锤模型涂装工作室'
    [languages.zh.params]
      description = "成都战锤微缩模型涂装委托工作室。展示级 NMM 金属光、OSL 光源效果与手绘自由涂，每件作品独立档案记录——每季度仅开放两个展示位。"
    [[languages.zh.menu.main]]
      name = "首页"
      pageRef = "/"
      weight = 10
    [[languages.zh.menu.main]]
      name = "作品"
      pageRef = "work"
      weight = 20
    [[languages.zh.menu.main]]
      name = "流程"
      pageRef = "process"
      weight = 30
    [[languages.zh.menu.main]]
      name = "报价"
      pageRef = "rates"
      weight = 40
    [[languages.zh.menu.main]]
      name = "关于"
      pageRef = "about"
      weight = 50

[module]
  [module.hugoVersion]
    extended = true
    min = "0.110.0"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[build]
  writeStats = true
  
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"
