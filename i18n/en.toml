[the_painter]
other = "THE PAINTER"

[painter_bio]
other = "I paint Warhammer miniatures in a small Chengdu apartment. One brush, one lamp, one figure at a time."

[painter_since]
other = "Painting since · 2019"

[painter_pieces]
other = "Pieces shipped · 42"

[painter_hours]
other = "Hours at the desk · 2,300+"

[painter_story_1]
other = "I started with a single Space Marine I bought on a whim in 2019 — primed it the wrong colour, washed it twice, ruined the highlights. Two days later I bought a second one to try again. Six years later, here we are."

[painter_story_2]
other = "I'm not a fast painter. I work in thin layers and I take photos at every stage. If you've found this page, it's probably because a friend pointed you here, or you opened a dossier I sent."

[painter_story_3]
other = "The studio is one desk by a north-facing window, a daylight lamp, and a cabinet of Citadel and Vallejo paints. I take two commissions at a time — that's the most I can do without rushing."

[painter_story_4]
other = "What I love painting: characters with cloth and freehand opportunities, vehicles with real weathering, anything with a story. What I won't paint: NMM gold, or anything with a deadline tighter than three weeks."

