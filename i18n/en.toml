[svc_custom_label]
other = "Why there are no tiers"
[svc_custom_1]
other = "Within one unit, the character and the rank-and-file never deserve the same hours. And the same model is painted differently for the table than for a cabinet. Split it into tiers and one side always gets shortchanged."
[svc_custom_2]
other = "So I like to look at photos before saying anything: what you want it to look like, how awkward the kits are, whether a scheme has to be matched. Scope falls out of that conversation."
[svc_custom_3]
other = "It does mean I cannot quote at a glance — it takes a few more messages. In return you never pay for steps you did not need, and never get something rushed because you picked the cheap option."
[svc_scope_label]
other = "What drives the scope"
[svc_scope_1_k]
