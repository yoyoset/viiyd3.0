<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>

  <!-- Language redirect -->
  <script>
    (function(){
      var p=localStorage.getItem('viiyd_lang_pref'),pa=window.location.pathname;
      if(pa==='/'&&p==='zh'){window.location.replace('/zh/');}
      else if(pa==='/zh/'&&p==='en'){window.location.replace('/');}
    })();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- CSS -->
  {{ $style := resources.Get "css/main.css" }}
  {{ $style = $style | css.PostCSS }}
  {{ if hugo.IsProduction }}{{ $style = $style | minify | fingerprint }}{{ end }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}">

  <!-- Cloudflare Turnstile (deferred — only fires when modal opens) -->
  {{ with .Site.Params.turnstile_site_key }}
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  {{ end }}

  <!-- SEO -->
  <meta name="description" content="{{ if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ .Params.description | default .Summary | default .Site.Params.description }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
  <meta property="og:description" content="{{ if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ .Params.description | default .Summary | default .Site.Params.description }}{{ end }}">
  <meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  {{ if .Params.cover }}<meta property="og:image" content="{{ .Params.cover }}">{{ end }}
  <meta property="og:site_name" content="{{ .Site.Title }}">
  <meta name="twitter:card" content="summary_large_image">
  {{ if .Params.cover }}<meta name="twitter:image" content="{{ .Params.cover }}">{{ end }}
</head>
