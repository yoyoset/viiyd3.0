<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
{{ partial "head.html" . }}
<body>
  {{ block "main" . }}{{ end }}
  {{ partial "site-footer.html" . }}
  {{ block "scripts" . }}
    {{ $js := resources.Get "js/lightbox.js" }}
    {{ if $js }}
      {{ if hugo.IsProduction }}{{ $js = $js | minify | fingerprint }}{{ end }}
      <script src="{{ $js.RelPermalink }}"></script>
    {{ end }}
  {{ end }}
</body>
</html>
